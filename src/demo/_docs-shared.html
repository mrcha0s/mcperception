<script>
// Auto-mark active sidebar link based on current filename
(function() {
    var page = location.pathname.split('/').pop().replace('.html','') || 'index';
    var links = document.querySelectorAll('.docs-nav-link');
    links.forEach(function(a) {
        if (a.getAttribute('data-page') === page) a.classList.add('active');
    });
    // Mobile hamburger toggle
    var hamburger = document.getElementById('docs-hamburger');
    var sidebar = document.getElementById('docs-sidebar');
    var overlay = document.getElementById('docs-overlay');
    if (hamburger && sidebar && overlay) {
        hamburger.addEventListener('click', function() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        });
        overlay.addEventListener('click', function() {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        });
    }
})();
</script>
-->
