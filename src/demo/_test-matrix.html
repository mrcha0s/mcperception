<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MC Perception — Hue × Surface × Component matrix (regression test)</title>
<link rel="stylesheet" href="../dist/mcperception.css">
<style>
  body { margin:0; background:var(--color-p-neutral-800); font-family:var(--font-sans); padding:14px; }
  .hue-block { margin-bottom:18px; }
  .hue-label { color:#FFFFFF; font-family:var(--font-condensed); font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; margin:0 0 6px 2px; }
  .modes { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .cell { border-radius:4px; padding:10px; min-height:120px; }
  .cell-tag { font-family:var(--font-mono); font-size:9px; margin-bottom:8px; }
  .grp { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
  /* Regression audit banner — palette-compliant, fixed top-right */
  #aa-result { position:fixed; top:10px; right:10px; z-index:9999; font-family:var(--font-mono); font-size:12px;
    padding:6px 10px; border-radius:3px; border:1px solid var(--color-p-neutral-600);
    background:var(--color-p-neutral-900); color:#FFFFFF; }
  #aa-result[data-state="pass"] { border-color:var(--color-p-green-400); color:var(--color-p-green-300); }
  #aa-result[data-state="fail"] { border-color:var(--color-p-red-400); color:var(--color-p-red-300); }
</style>
</head>
<body>
<div id="aa-result">AA: running…</div>
<div id="matrix-legend" style="color:#FFFFFF;font-family:var(--font-condensed);font-size:11px;margin:0 0 12px 2px;letter-spacing:.04em;">
  Each row = one hue. Columns: Mode 1 — White · Mode 2 — Black · Mode 3 — Light Hue · Mode 4 — Dark Hue · Mode 5 — Mid Hue
</div>
<div id="matrix"></div>
<script>
  const hues = ['neutral','red','green','blue','yellow','magenta','teal'];
  const modes = [1,2,3,4,5];
  const surfaceBg = (h,m) => ({1:'#FFFFFF',2:'#0A0A0A',3:`var(--color-p-${h}-100)`,4:`var(--color-p-${h}-800)`,5:`var(--color-p-${h}-500)`}[m]);
  const tagColor = m => (m===1||m===3) ? '#0A0A0A' : '#FFFFFF';
  const root = document.getElementById('matrix');

  for (const h of hues) {
    const block = document.createElement('div'); block.className='hue-block';
    block.innerHTML = `<div class="hue-label">${h}</div>`;
    const modesWrap = document.createElement('div'); modesWrap.className='modes';
    for (const m of modes) {
      const cell = document.createElement('div');
      cell.className='cell'; cell.setAttribute('data-hue',h); cell.setAttribute('data-mode',m);
      cell.setAttribute('data-cell', `${h}-M${m}`);
      cell.style.background = surfaceBg(h,m);
      cell.innerHTML = `
        <div class="cell-tag" style="color:${tagColor(m)}">Mode ${m}</div>
        <div class="grp">
          <button class="mc-button mc-button-filled mc-button-sm" data-hue="${h}" data-test="btn-filled">Aa</button>
          <button class="mc-button mc-button-tonal mc-button-sm" data-hue="${h}" data-test="btn-tonal">Aa</button>
          <button class="mc-button mc-button-outline mc-button-sm" data-hue="${h}" data-test="btn-outline">Aa</button>
          <button class="mc-button mc-button-ghost mc-button-sm" data-hue="${h}" data-test="btn-ghost">Aa</button>
        </div>
        <div class="grp">
          <span class="mc-badge mc-badge-filled mc-badge-sm" data-hue="${h}" data-test="badge-filled">Aa</span>
          <span class="mc-badge mc-badge-tonal mc-badge-sm" data-hue="${h}" data-test="badge-tonal">Aa</span>
          <span class="mc-badge mc-badge-outline mc-badge-sm" data-hue="${h}" data-test="badge-outline">Aa</span>
          <span class="mc-badge mc-badge-subtle mc-badge-sm" data-hue="${h}" data-test="badge-subtle">Aa</span>
        </div>
        <div class="grp" style="display:block">
          <div class="mc-alert" data-hue="${h}" data-test="alert" style="padding:6px 8px;font-size:11px"><div class="mc-alert-content" data-test="alert-text">Alert message</div></div>
        </div>
        <div class="grp" style="display:block;margin-top:6px">
          <div class="mc-panel mc-panel-sm" data-hue="${h}" data-test="panel">
            <span class="mc-panel-title" data-test="panel-title">Panel</span>
            <div data-test="panel-body" style="font-size:11px">Body copy</div>
          </div>
        </div>
        <div class="grp" style="display:block;margin-top:6px">
          <div class="mc-stat mc-stat-sm" data-hue="${h}" data-test="stat" style="padding:6px 8px">
            <div class="mc-stat-title" data-test="stat-title">KPI</div>
            <div class="mc-stat-value" data-test="stat-value">1,284</div>
            <div class="mc-stat-desc" data-test="stat-desc">+2.18%</div>
          </div>
        </div>`;
      modesWrap.appendChild(cell);
    }
    block.appendChild(modesWrap);
    root.appendChild(block);
  }
</script>

<!-- §3 contrast-audit (from HANDOFF-mcperception-changes.md). Expected: 0 AA fail — the framework source is clean. -->
<script>
  function runAaAudit() {
    const fails = (() => {
      const parse = s => (s.match(/[\d.]+/g)||[0,0,0]).map(Number);
      const lin = c => { c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); };
      const L = ([r,g,b]) => 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
      const ratio = (a,b) => { const l1=L(a),l2=L(b),hi=Math.max(l1,l2),lo=Math.min(l1,l2); return (hi+0.05)/(lo+0.05); };
      const bgOf = el => { let e=el; while(e){ const c=getComputedStyle(e).backgroundColor; if(c && !/rgba?\(0, 0, 0, 0\)|transparent/.test(c)) return parse(c); e=e.parentElement; } return [10,10,10]; };
      const skip = new Set(['SCRIPT','STYLE']);
      const out = [];
      document.querySelectorAll('body *').forEach(el => {
        if (skip.has(el.tagName) || el.id === 'aa-result') return;
        const t = [...el.childNodes].filter(n=>n.nodeType===3 && n.textContent.trim()).map(n=>n.textContent.trim()).join('');
        if (!t) return;
        const cs = getComputedStyle(el), fs = parseFloat(cs.fontSize), fw = +cs.fontWeight||400;
        const large = fs>=24 || (fs>=18.66 && fw>=700);
        const r = ratio(parse(cs.color), bgOf(el));
        if (r < (large?3:4.5)) out.push(`${r.toFixed(2)}  ${fs}px  "${t.slice(0,30)}"  [${el.className}]`);
      });
      return out;
    })();
    console.log(`${fails.length} AA fail:\n` + fails.join('\n'));
    window.__AA_RESULT = { count: fails.length, fails };
    const banner = document.getElementById('aa-result');
    if (banner) {
      banner.textContent = `AA: ${fails.length} fail`;
      banner.setAttribute('data-state', fails.length === 0 ? 'pass' : 'fail');
    }
    return fails;
  }
  window.addEventListener('load', runAaAudit);
</script>
</body>
</html>
