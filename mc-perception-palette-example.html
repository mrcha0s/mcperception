<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Perception - Color Palette Examples</title>
  <link rel="stylesheet" href="https://mrcha0s.github.io/mcperception/src/dist/mcperception.css">
  <style>
    body {
      padding: 12px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin: 16px 0 8px 0;
    }

    .section-label:first-child {
      margin-top: 0;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 3px;
    }

    .card {
      padding: 8px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 1px;
    }

    .card-subtitle {
      font-size: 8px;
      margin-bottom: 8px;
    }

    .card-buttons {
      display: flex;
      gap: 5px;
    }

    .card-btn {
      padding: 4px 8px;
      border-radius: 2px;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: none;
      cursor: pointer;
    }

    .contrast-grid {
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 3px;
      margin-top: 16px;
    }

    .contrast-col {
      padding: 4px;
      font-size: 7px;
    }

    .contrast-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 0;
    }

    .contrast-swatch {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .contrast-hex {
      flex: 1;
    }

    .contrast-value {
      text-align: right;
      min-width: 28px;
    }
  </style>
</head>
<body class="bg-mc-dark-gray-900">

  <div class="section-label" style="color: var(--color-mc-dark-gray-100);">White Background</div>
  <div class="palette-grid" id="whiteGrid"></div>

  <div class="section-label" style="color: var(--color-mc-dark-gray-100);">Black Background</div>
  <div class="palette-grid" id="blackGrid"></div>

  <div class="section-label" style="color: var(--color-mc-dark-gray-100);">Light Color Backgrounds</div>
  <div class="palette-grid" id="lightGrid"></div>

  <div class="section-label" style="color: var(--color-mc-dark-gray-100);">Dark Color Backgrounds</div>
  <div class="palette-grid" id="darkGrid"></div>

  <div class="section-label" style="color: var(--color-mc-dark-gray-100);">Contrast Reference</div>
  <div class="contrast-grid" id="contrastGrid"></div>

  <script>
    // Color mappings using CSS variable names from mcperception.css
    const colors = {
      darkGray: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#b8b8b8', '#7f7f7f', '#646464', '#515151', '#424242', '#373737', '#2c2c2c', '#222222', '#171717', '#090909'],
        prefix: 'mc-dark-gray'
      },
      lightGray: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#fafafa', '#eeeeee', '#e1e1e1', '#d2d2d2', '#c3c3c3', '#b3b3b3', '#a0a0a0', '#898989', '#6c6c6c', '#3f3f3f'],
        prefix: 'mc-light-gray'
      },
      darkRed: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#ff9c9c', '#ff0000', '#ca0000', '#a70000', '#8b0000', '#740000', '#600000', '#460000', '#380000', '#1c0000'],
        prefix: 'mc-dark-red'
      },
      lightRed: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#fff8f8', '#ffe9e9', '#ffd8d8', '#ffc5c5', '#ffafaf', '#ff9696', '#ff7474', '#ff3e3e', '#da0000', '#850000'],
        prefix: 'mc-light-red'
      },
      darkGreen: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#00d500', '#009400', '#007400', '#005f00', '#004f00', '#004000', '#003500', '#002900', '#001d00', '#000c00'],
        prefix: 'mc-dark-green'
      },
      lightGreen: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#ebffeb', '#b7ffb7', '#62ff62', '#00f400', '#00e400', '#00d000', '#00ba00', '#009f00', '#007f00', '#004b00'],
        prefix: 'mc-light-green'
      },
      darkBlue: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#b0b0ff', '#6d6dff', '#4444ff', '#1919ff', '#0000e3', '#0000bf', '#00009f', '#000081', '#000060', '#000035'],
        prefix: 'mc-dark-blue'
      },
      lightBlue: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#f8f8ff', '#ececff', '#dedeff', '#ceceff', '#bebeff', '#ababff', '#9494ff', '#7979ff', '#5252ff', '#0000d9'],
        prefix: 'mc-light-blue'
      },
      darkYellow: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#bdbd00', '#838300', '#676700', '#545400', '#444400', '#383800', '#2e2e00', '#242400', '#181800', '#090900'],
        prefix: 'mc-dark-yellow'
      },
      lightYellow: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#ffff97', '#f6f600', '#e8e800', '#d9d900', '#caca00', '#b9b900', '#a6a600', '#8d8d00', '#6f6f00', '#424200'],
        prefix: 'mc-light-yellow'
      },
      darkPurple: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#ff8dff', '#e000e0', '#b100b1', '#910091', '#7a007a', '#660066', '#530053', '#420042', '#300030', '#170017'],
        prefix: 'mc-dark-purple'
      },
      lightPurple: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#fff7ff', '#ffe5ff', '#ffd2ff', '#ffbeff', '#ffa4ff', '#ff84ff', '#ff55ff', '#f100f1', '#c000c0', '#740074'],
        prefix: 'mc-light-purple'
      },
      darkCyan: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#00cccc', '#008e8e', '#006f6f', '#005a5a', '#004b4b', '#003d3d', '#003131', '#002727', '#001b1b', '#000b0b'],
        prefix: 'mc-dark-cyan'
      },
      lightCyan: {
        shades: ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900'],
        values: ['#e3ffff', '#96ffff', '#00f9f9', '#00ebeb', '#00dada', '#00c8c8', '#00b2b2', '#009999', '#007979', '#004848'],
        prefix: 'mc-light-cyan'
      }
    };

    const colorOrder = [
      'darkGray', 'lightGray',
      'darkRed', 'lightRed',
      'darkGreen', 'lightGreen',
      'darkBlue', 'lightBlue',
      'darkYellow', 'lightYellow',
      'darkPurple', 'lightPurple',
      'darkCyan', 'lightCyan'
    ];

    // White background config
    const whiteConfig = {
      darkGray:    { title: '900', subtitle: '200', btnBg: '500', btnText: 'white' },
      lightGray:   { title: '900', subtitle: '700', btnBg: '500', btnText: 'black' },
      darkRed:     { title: '500', subtitle: '300', btnBg: '200', btnText: 'white' },
      lightRed:    { title: '900', subtitle: '800', btnBg: '600', btnText: 'black' },
      darkGreen:   { title: '500', subtitle: '300', btnBg: '200', btnText: 'white' },
      lightGreen:  { title: '900', subtitle: '800', btnBg: '600', btnText: 'black' },
      darkBlue:    { title: '700', subtitle: '500', btnBg: '300', btnText: 'white' },
      lightBlue:   { title: '900', subtitle: '800', btnBg: '700', btnText: 'black' },
      darkYellow:  { title: '500', subtitle: '300', btnBg: '200', btnText: 'white' },
      lightYellow: { title: '900', subtitle: '800', btnBg: '600', btnText: 'black' },
      darkPurple:  { title: '600', subtitle: '400', btnBg: '200', btnText: 'white' },
      lightPurple: { title: '900', subtitle: '800', btnBg: '600', btnText: 'black' },
      darkCyan:    { title: '500', subtitle: '300', btnBg: '200', btnText: 'white' },
      lightCyan:   { title: '900', subtitle: '800', btnBg: '600', btnText: 'black' }
    };

    // Black background config
    const blackConfig = {
      darkGray:    { title: '50', subtitle: '200', btnBg: '300', btnText: 'white' },
      lightGray:   { title: '50', subtitle: '600', btnBg: '400', btnText: 'black' },
      darkRed:     { title: '50', subtitle: '200', btnBg: '300', btnText: 'white' },
      lightRed:    { title: '400', subtitle: '700', btnBg: '600', btnText: 'black' },
      darkGreen:   { title: '50', subtitle: '200', btnBg: '300', btnText: 'white' },
      lightGreen:  { title: '200', subtitle: '600', btnBg: '500', btnText: 'black' },
      darkBlue:    { title: '50', subtitle: '200', btnBg: '300', btnText: 'white' },
      lightBlue:   { title: '400', subtitle: '700', btnBg: '600', btnText: 'black' },
      darkYellow:  { title: '50', subtitle: '200', btnBg: '300', btnText: 'white' },
      lightYellow: { title: '50', subtitle: '600', btnBg: '500', btnText: 'black' },
      darkPurple:  { title: '50', subtitle: '200', btnBg: '300', btnText: 'white' },
      lightPurple: { title: '400', subtitle: '700', btnBg: '600', btnText: 'black' },
      darkCyan:    { title: '50', subtitle: '200', btnBg: '300', btnText: 'white' },
      lightCyan:   { title: '100', subtitle: '700', btnBg: '600', btnText: 'black' }
    };

    // Light color backgrounds (shades 50, 100, 200)
    const lightBgRows = [
      { bgShade: 0, titleDark: true, subtitleShade: 5, btnShade: 2, btnTextDark: false },
      { bgShade: 1, titleDark: false, subtitleShade: 0, btnShade: 3, btnTextDark: false },
      { bgShade: 2, titleDark: false, subtitleShade: 0, btnShade: 4, btnTextDark: false }
    ];

    // Dark color backgrounds (shades 300, 400, 500)
    const darkBgRows = [
      { bgShade: 3, titleDark: false, subtitleShade: 0, btnShade: 5, btnTextDark: false },
      { bgShade: 4, titleDark: false, subtitleShade: 0, btnShade: 6, btnTextDark: false },
      { bgShade: 5, titleDark: false, subtitleShade: 0, btnShade: 7, btnTextDark: false }
    ];

    // Special handling for light palette families
    const lightFamilies = ['lightGray', 'lightRed', 'lightGreen', 'lightBlue', 'lightYellow', 'lightPurple', 'lightCyan'];
    
    const lightBgRowsForLight = [
      { bgShade: 0, titleDark: true, subtitleShade: 9, btnShade: 5, btnTextDark: true },
      { bgShade: 1, titleDark: true, subtitleShade: 9, btnShade: 6, btnTextDark: true },
      { bgShade: 2, titleDark: true, subtitleShade: 9, btnShade: 7, btnTextDark: false }
    ];

    const darkBgRowsForLight = [
      { bgShade: 3, titleDark: true, subtitleShade: 9, btnShade: 8, btnTextDark: false },
      { bgShade: 4, titleDark: true, subtitleShade: 9, btnShade: 8, btnTextDark: false },
      { bgShade: 5, titleDark: true, subtitleShade: 9, btnShade: 9, btnTextDark: false }
    ];

    function getColorVar(prefix, shade) {
      return `var(--color-${prefix}-${shade})`;
    }

    function createCard(bgColor, titleColor, subtitleColor, btnBgColor, btnTextColor) {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.backgroundColor = bgColor;
      card.innerHTML = `
        <div class="card-title" style="color: ${titleColor};">Large text</div>
        <div class="card-subtitle" style="color: ${subtitleColor};">Small text demo</div>
        <div class="card-buttons">
          <button class="card-btn" style="background-color: ${btnBgColor}; color: ${btnTextColor};">Button</button>
          <button class="card-btn" style="background-color: ${btnBgColor}; color: ${btnTextColor};">Button</button>
        </div>
      `;
      return card;
    }

    // White Background Grid
    const whiteGrid = document.getElementById('whiteGrid');
    colorOrder.forEach(colorKey => {
      const colorDef = colors[colorKey];
      const cfg = whiteConfig[colorKey];
      const card = createCard(
        '#ffffff',
        getColorVar(colorDef.prefix, cfg.title),
        getColorVar(colorDef.prefix, cfg.subtitle),
        getColorVar(colorDef.prefix, cfg.btnBg),
        cfg.btnText === 'white' ? '#ffffff' : '#000000'
      );
      whiteGrid.appendChild(card);
    });

    // Black Background Grid
    const blackGrid = document.getElementById('blackGrid');
    colorOrder.forEach(colorKey => {
      const colorDef = colors[colorKey];
      const cfg = blackConfig[colorKey];
      const card = createCard(
        '#000000',
        getColorVar(colorDef.prefix, cfg.title),
        getColorVar(colorDef.prefix, cfg.subtitle),
        getColorVar(colorDef.prefix, cfg.btnBg),
        cfg.btnText === 'white' ? '#ffffff' : '#000000'
      );
      blackGrid.appendChild(card);
    });

    // Light Color Backgrounds Grid (3 rows)
    const lightGrid = document.getElementById('lightGrid');
    for (let row = 0; row < 3; row++) {
      colorOrder.forEach(colorKey => {
        const colorDef = colors[colorKey];
        const isLightFamily = lightFamilies.includes(colorKey);
        const rowCfg = isLightFamily ? lightBgRowsForLight[row] : lightBgRows[row];
        
        const bgShadeIdx = rowCfg.bgShade;
        const bgColor = getColorVar(colorDef.prefix, colorDef.shades[bgShadeIdx]);
        const titleColor = rowCfg.titleDark ? '#000000' : '#ffffff';
        const subtitleColor = getColorVar(colorDef.prefix, colorDef.shades[rowCfg.subtitleShade]);
        const btnBgColor = getColorVar(colorDef.prefix, colorDef.shades[rowCfg.btnShade]);
        const btnTextColor = rowCfg.btnTextDark ? '#000000' : '#ffffff';

        lightGrid.appendChild(createCard(bgColor, titleColor, subtitleColor, btnBgColor, btnTextColor));
      });
    }

    // Dark Color Backgrounds Grid (3 rows)
    const darkGrid = document.getElementById('darkGrid');
    for (let row = 0; row < 3; row++) {
      colorOrder.forEach(colorKey => {
        const colorDef = colors[colorKey];
        const isLightFamily = lightFamilies.includes(colorKey);
        const rowCfg = isLightFamily ? darkBgRowsForLight[row] : darkBgRows[row];
        
        const bgShadeIdx = rowCfg.bgShade;
        const bgColor = getColorVar(colorDef.prefix, colorDef.shades[bgShadeIdx]);
        const titleColor = rowCfg.titleDark ? '#000000' : '#ffffff';
        const subtitleColor = getColorVar(colorDef.prefix, colorDef.shades[rowCfg.subtitleShade]);
        const btnBgColor = getColorVar(colorDef.prefix, colorDef.shades[rowCfg.btnShade]);
        const btnTextColor = rowCfg.btnTextDark ? '#000000' : '#ffffff';

        darkGrid.appendChild(createCard(bgColor, titleColor, subtitleColor, btnBgColor, btnTextColor));
      });
    }

    // Contrast calculation functions
    function getLuminance(hex) {
      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;
      
      const rLin = r <= 0.03928 ? r / 12.92 : Math.pow((r + 0.055) / 1.055, 2.4);
      const gLin = g <= 0.03928 ? g / 12.92 : Math.pow((g + 0.055) / 1.055, 2.4);
      const bLin = b <= 0.03928 ? b / 12.92 : Math.pow((b + 0.055) / 1.055, 2.4);
      
      return 0.2126 * rLin + 0.7152 * gLin + 0.0722 * bLin;
    }

    function getContrastRatio(hex1, hex2) {
      const l1 = getLuminance(hex1);
      const l2 = getLuminance(hex2);
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    // Generate contrast data grid
    const contrastGrid = document.getElementById('contrastGrid');

    colorOrder.forEach(colorKey => {
      const colorDef = colors[colorKey];
      const col = document.createElement('div');
      col.className = 'contrast-col bg-black font-mono';

      colorDef.values.forEach((hex, idx) => {
        const contrastWhite = getContrastRatio(hex, '#ffffff');
        const contrastBlack = getContrastRatio(hex, '#000000');
        
        const useWhite = contrastWhite > contrastBlack;
        const contrastValue = useWhite ? contrastWhite : contrastBlack;
        const displayValue = useWhite ? -contrastValue.toFixed(2) : contrastValue.toFixed(2);
        
        const row = document.createElement('div');
        row.className = 'contrast-row';
        row.style.borderBottom = idx < 9 ? '1px solid var(--color-mc-dark-gray-800)' : 'none';
        row.innerHTML = `
          <div class="contrast-swatch" style="background-color: ${hex};"></div>
          <div class="contrast-hex" style="color: var(--color-mc-dark-gray-50);">${hex}</div>
          <div class="contrast-value" style="color: ${parseFloat(displayValue) >= 0 ? 'var(--color-mc-light-green-500)' : 'var(--color-mc-light-red-600)'};">${displayValue}</div>
        `;
        col.appendChild(row);
      });

      contrastGrid.appendChild(col);
    });
  </script>

</body>
</html>
