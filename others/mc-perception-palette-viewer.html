<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Perception Color Palette</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0a;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }

    .header p {
      color: #888;
      font-size: 14px;
    }

    .theme-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .theme-btn {
      padding: 8px 16px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      text-transform: capitalize;
      background-color: #2a2a2a;
      color: #888;
      transition: all 150ms;
    }

    .theme-btn:hover {
      background-color: #333;
    }

    .theme-btn.active {
      background-color: #3b82f6;
      color: #fff;
    }

    .selected-color {
      background-color: #1a1a1a;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      display: none;
      align-items: center;
      gap: 16px;
      border: 1px solid #333;
    }

    .selected-color.visible {
      display: flex;
    }

    .selected-preview {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      border: 1px solid #444;
    }

    .selected-info {
      flex: 1;
    }

    .selected-name {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .selected-hex {
      font-family: monospace;
      color: #888;
      font-size: 14px;
    }

    .selected-var {
      font-family: monospace;
      color: #666;
      font-size: 12px;
      margin-top: 4px;
    }

    .copy-status {
      padding: 8px 16px;
      background-color: #2a2a2a;
      border-radius: 4px;
      font-size: 12px;
      color: #888;
      transition: all 150ms;
    }

    .copy-status.copied {
      background-color: #22c55e;
      color: #fff;
    }

    .palette-grid {
      display: grid;
      gap: 16px;
    }

    .color-family {
      display: none;
    }

    .color-family.visible {
      display: block;
    }

    .family-name {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .family-variants {
      display: grid;
      gap: 8px;
    }

    .variant-label {
      font-size: 10px;
      color: #555;
      margin-bottom: 4px;
    }

    .color-row {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 2px;
      border-radius: 4px;
      overflow: hidden;
    }

    .color-swatch {
      padding: 8px 4px;
      text-align: center;
      font-size: 10px;
      font-family: monospace;
      cursor: pointer;
      transition: all 150ms;
    }

    .color-swatch:hover {
      transform: scale(1.05);
      z-index: 10;
      position: relative;
    }

    .color-swatch.selected {
      ring: 2px solid white;
      transform: scale(1.05);
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px #0a0a0a;
      z-index: 10;
      position: relative;
    }

    .swatch-shade {
      font-weight: 600;
    }

    .swatch-hex {
      opacity: 0.8;
    }

    .quick-ref {
      margin-top: 32px;
      padding: 16px;
      background-color: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .quick-ref-title {
      font-size: 12px;
      font-weight: 600;
      color: #888;
      margin-bottom: 12px;
    }

    .quick-ref-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      font-size: 11px;
      font-family: monospace;
    }

    .quick-ref-item {
      color: #666;
    }

    .quick-ref-item div:first-child {
      margin-bottom: 4px;
    }

    .quick-ref-item code {
      color: #9ca3af;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .color-row {
        grid-template-columns: repeat(5, 1fr);
      }

      .selected-color {
        flex-direction: column;
        text-align: center;
      }

      .quick-ref-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>MC Perception</h1>
      <p>Function-first color palette for trading dashboards and data-dense UIs</p>
    </div>

    <div class="theme-buttons">
      <button class="theme-btn active" data-theme="dark">Dark Theme</button>
      <button class="theme-btn" data-theme="light">Light Theme</button>
      <button class="theme-btn" data-theme="all">All</button>
    </div>

    <div class="selected-color" id="selectedColor">
      <div class="selected-preview" id="selectedPreview"></div>
      <div class="selected-info">
        <div class="selected-name" id="selectedName"></div>
        <div class="selected-hex" id="selectedHex"></div>
        <div class="selected-var" id="selectedVar"></div>
      </div>
      <div class="copy-status" id="copyStatus">Click to copy</div>
    </div>

    <div class="palette-grid" id="paletteGrid"></div>

    <div class="quick-ref">
      <div class="quick-ref-title">Quick Reference</div>
      <div class="quick-ref-grid">
        <div class="quick-ref-item">
          <div>CSS Variable</div>
          <code>var(--color-mc-dark-gray-800)</code>
        </div>
        <div class="quick-ref-item">
          <div>Tailwind BG Class</div>
          <code>bg-mc-dark-gray-800</code>
        </div>
        <div class="quick-ref-item">
          <div>Tailwind Text Class</div>
          <code>text-mc-light-green-500</code>
        </div>
      </div>
    </div>
  </div>

    let currentTheme = 'dark';
    let selectedColorData = null;

    function getContrastColor(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.5 ? '#000000' : '#ffffff';
    }

    function createColorRow(variant, variantName) {
      const row = document.createElement('div');
      row.className = 'color-row';
      
      variant.colors.forEach(color => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.backgroundColor = color.hex;
        swatch.style.color = getContrastColor(color.hex);
        swatch.dataset.hex = color.hex;
        swatch.dataset.prefix = variant.prefix;
        swatch.dataset.shade = color.shade;
        
        swatch.innerHTML = `
          <div class="swatch-shade">${color.shade}</div>
          <div class="swatch-hex">${color.hex}</div>
        `;
        
        swatch.addEventListener('click', () => selectColor(color, variant.prefix));
        row.appendChild(swatch);
      });
      
      return row;
    }

    function selectColor(color, prefix) {
      // Remove previous selection
      document.querySelectorAll('.color-swatch.selected').forEach(el => {
        el.classList.remove('selected');
      });
      
      // Add selection to clicked swatch
      const clickedSwatch = document.querySelector(`.color-swatch[data-hex="${color.hex}"][data-prefix="${prefix}"]`);
      if (clickedSwatch) {
        clickedSwatch.classList.add('selected');
      }
      
      // Update selected color display
      const selectedEl = document.getElementById('selectedColor');
      const previewEl = document.getElementById('selectedPreview');
      const nameEl = document.getElementById('selectedName');
      const hexEl = document.getElementById('selectedHex');
      const varEl = document.getElementById('selectedVar');
      const copyEl = document.getElementById('copyStatus');
      
      selectedEl.classList.add('visible');
      previewEl.style.backgroundColor = color.hex;
      nameEl.textContent = `${prefix}-${color.shade}`;
      hexEl.textContent = color.hex;
      varEl.textContent = `--color-${prefix}-${color.shade}`;
      
      // Copy to clipboard
      navigator.clipboard.writeText(color.hex).then(() => {
        copyEl.textContent = '✓ Copied!';
        copyEl.classList.add('copied');
        setTimeout(() => {
          copyEl.textContent = 'Click to copy';
          copyEl.classList.remove('copied');
        }, 1500);
      });
      
      selectedColorData = { ...color, prefix };
    }

    function renderPalette() {
      const grid = document.getElementById('paletteGrid');
      grid.innerHTML = '';
      
      Object.entries(colorData).forEach(([familyName, variants]) => {
        const familyEl = document.createElement('div');
        familyEl.className = 'color-family';
        familyEl.dataset.family = familyName;
        
        const nameEl = document.createElement('div');
        nameEl.className = 'family-name';
        nameEl.textContent = familyName;
        familyEl.appendChild(nameEl);
        
        const variantsEl = document.createElement('div');
        variantsEl.className = 'family-variants';
        
        // Dark variant
        if (variants.dark) {
          const darkWrapper = document.createElement('div');
          darkWrapper.className = 'variant-wrapper';
          darkWrapper.dataset.variant = 'dark';
          
          const darkLabel = document.createElement('div');
          darkLabel.className = 'variant-label';
          darkLabel.textContent = 'Dark';
          darkWrapper.appendChild(darkLabel);
          darkWrapper.appendChild(createColorRow(variants.dark, 'dark'));
          variantsEl.appendChild(darkWrapper);
        }
        
        // Light variant
        if (variants.light) {
          const lightWrapper = document.createElement('div');
          lightWrapper.className = 'variant-wrapper';
          lightWrapper.dataset.variant = 'light';
          
          const lightLabel = document.createElement('div');
          lightLabel.className = 'variant-label';
          lightLabel.textContent = 'Light';
          lightWrapper.appendChild(lightLabel);
          lightWrapper.appendChild(createColorRow(variants.light, 'light'));
          variantsEl.appendChild(lightWrapper);
        }
        
        familyEl.appendChild(variantsEl);
        grid.appendChild(familyEl);
      });
      
      updateVisibility();
    }

    function updateVisibility() {
      document.querySelectorAll('.color-family').forEach(family => {
        family.classList.add('visible');
      });
      
      document.querySelectorAll('.variant-wrapper').forEach(wrapper => {
        const variant = wrapper.dataset.variant;
        if (currentTheme === 'all') {
          wrapper.style.display = 'block';
        } else if (currentTheme === variant) {
          wrapper.style.display = 'block';
        } else {
          wrapper.style.display = 'none';
        }
      });
    }

    function setTheme(theme) {
      currentTheme = theme;
      
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });
      
      updateVisibility();
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      renderPalette();
      
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', () => setTheme(btn.dataset.theme));
      });
    });
  </script>
</body>
</html>
